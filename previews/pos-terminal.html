<!doctype html>
<html lang="ar" dir="rtl">
<head>

  <meta name="csrf-token" content="IjU2MDhhNjVmODkzYjU5Zjg5ZjYwMmY3NTdmZmY3YWIzZTQwY2U0NzUi.apqnnw.sEZ7mQO6Rzq9ilneGHBneWPAou4">
  <title>نقطة البيع — وردية POS-2026-000001 — دكتور بورسلين</title>

  <!-- Tailwind (utility layer) + Bootstrap Icons + Cairo font -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Cairo', 'Inter', 'system-ui', 'sans-serif'] },
          colors: {
            brand:   { 500:'#0ea5e9', 600:'#0284c7', 700:'#0369a1' },
            navy:    { 800:'#0f172a', 700:'#334155', 500:'#64748b', 300:'#cbd5e1' },
          },
        },
      },
    };
  </script>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

  
<style>
  :root {
    /* Brand — sky-blue ramp (porcelain water theme) */
    --dp-brand:        #0284c7;   /* sky-600 — canonical brand */
    --dp-brand-dark:   #0369a1;   /* sky-700 — hover / gradients */
    --dp-brand-mid:    #0ea5e9;   /* sky-500 — accents */
    --dp-brand-tint:   #E0F2FE;   /* sky-100 — active nav bg */
    --dp-brand-soft:   #F0F9FF;   /* sky-50  — panel tint */

    /* Semantic status colors */
    --dp-success:      #16a34a;
    --dp-success-soft: #dcfce7;
    --dp-warning:      #d97706;
    --dp-warning-soft: #fef3c7;
    --dp-danger:       #dc2626;
    --dp-danger-soft:  #fee2e2;
    --dp-info:         #2563eb;
    --dp-info-soft:    #dbeafe;

    /* Ink — 4-step neutral for text hierarchy */
    --dp-ink-1:        #0f172a;  /* strongest — headings, values */
    --dp-ink-2:        #334155;  /* body text */
    --dp-ink-3:        #64748b;  /* meta / muted body */
    --dp-ink-4:        #64748b;  /* placeholders / hints — WCAG AA */

    /* Surface & background */
    --dp-surface:      #ffffff;
    --dp-surface-soft: #f8fafc;
    --dp-bg:           #f5f8fb;
    /* App ground: subtle vertical gradient from white to sky tint */
    --dp-app-bg:       linear-gradient(180deg, #ffffff 0%, #f0f9ff 100%);

    /* Line / borders */
    --dp-line:         #e5e7eb;
    --dp-line-strong:  #cbd5e1;

    /* Radius scale */
    --dp-radius-sm:    8px;
    --dp-radius-md:    12px;
    --dp-radius-lg:    16px;
    --dp-radius-pill:  9999px;

    /* Shadow scale */
    --dp-shadow-sm:    0 1px 2px rgba(15,23,42,.05);
    --dp-shadow-md:    0 4px 12px rgba(15,23,42,.06);
    --dp-shadow-lg:    0 10px 30px rgba(15,23,42,.09);

    /* Typography scale */
    --dp-font-body:    'Cairo', 'Inter', system-ui, sans-serif;
    --dp-font-mono:    ui-monospace, 'SF Mono', Menlo, monospace;
    --dp-fs-xs:        11.5px;
    --dp-fs-sm:        12.5px;
    --dp-fs-base:      13.5px;
    --dp-fs-lg:        15px;
    --dp-fs-xl:        18px;
    --dp-fs-h1:        22px;

    /* Space scale */
    --dp-gap-1:        4px;
    --dp-gap-2:        8px;
    --dp-gap-3:        12px;
    --dp-gap-4:        16px;
    --dp-gap-5:        20px;
    --dp-gap-6:        24px;
  }

  /* ───────────────────────────────────────────────────────
     Empty state
     Usage:
       <div class="empty-state">
         <div class="empty-state-icon">🆕</div>
         <div class="empty-state-title">لا توجد بيانات</div>
         <div class="empty-state-sub">أضف أول بند لتبدأ.</div>
       </div>
     ─────────────────────────────────────────────────────── */
  .empty-state {
    text-align: center;
    padding: 40px 24px;
    color: var(--dp-ink-3);
    background: var(--dp-surface-soft);
    border-radius: var(--dp-radius-md);
  }
  .empty-state-icon { font-size: 34px; margin-bottom: 8px; opacity: .75; }
  .empty-state-title {
    font-size: var(--dp-fs-base);
    font-weight: 600;
    color: var(--dp-ink-2);
    margin-bottom: 4px;
  }
  .empty-state-sub { font-size: var(--dp-fs-sm); color: var(--dp-ink-4); }

  /* Loading spinner */
  .dp-spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid var(--dp-line-strong);
    border-top-color: var(--dp-brand);
    border-radius: 50%;
    animation: dp-spin 0.7s linear infinite;
    vertical-align: middle;
  }
  @keyframes dp-spin { to { transform: rotate(360deg); } }

  /* KPI stat tile */
  .stat-tile {
    background: var(--dp-surface);
    border: 1px solid var(--dp-line);
    border-radius: var(--dp-radius-lg);
    padding: 16px 18px;
    box-shadow: var(--dp-shadow-sm);
  }
  .stat-tile-label {
    font-size: var(--dp-fs-sm);
    color: var(--dp-ink-3);
    font-weight: 500;
    margin-bottom: 4px;
  }
  .stat-tile-value {
    font-size: 22px;
    font-weight: 700;
    color: var(--dp-ink-1);
    line-height: 1.15;
    letter-spacing: -0.4px;
  }
  .stat-tile-hint {
    font-size: var(--dp-fs-xs);
    color: var(--dp-ink-3);
    margin-top: 4px;
  }
  .stat-tile.tone-success { background: var(--dp-success-soft); }
  .stat-tile.tone-success .stat-tile-value { color: var(--dp-success); }
  .stat-tile.tone-warning { background: var(--dp-warning-soft); }
  .stat-tile.tone-warning .stat-tile-value { color: var(--dp-warning); }
  .stat-tile.tone-danger  { background: var(--dp-danger-soft); }
  .stat-tile.tone-danger  .stat-tile-value { color: var(--dp-danger); }
  .stat-tile.tone-brand   { background: var(--dp-brand-soft); }
  .stat-tile.tone-brand   .stat-tile-value { color: var(--dp-brand-dark); }

  /* KPI with icon (visual variant used across mtgar) */
  .stat-tile-with-icon {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .stat-tile-with-icon .stat-tile-icon {
    width: 46px; height: 46px;
    border-radius: 12px;
    background: var(--dp-brand-tint);
    color: var(--dp-brand);
    display: grid; place-items: center;
    font-size: 1.3rem;
    flex-shrink: 0;
  }
  .stat-tile-with-icon.tone-success .stat-tile-icon { background: var(--dp-success-soft); color: var(--dp-success); }
  .stat-tile-with-icon.tone-warning .stat-tile-icon { background: var(--dp-warning-soft); color: var(--dp-warning); }
  .stat-tile-with-icon.tone-danger  .stat-tile-icon { background: var(--dp-danger-soft);  color: var(--dp-danger); }

  /* Page header */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--dp-gap-3);
    margin-bottom: var(--dp-gap-5);
    flex-wrap: wrap;
  }
  .page-header .page-title {
    font-size: var(--dp-fs-xl);
    font-weight: 700;
    color: var(--dp-ink-1);
    margin: 0;
  }
  .page-header .page-subtitle {
    font-size: var(--dp-fs-sm);
    color: var(--dp-ink-3);
    margin: 4px 0 0;
    line-height: 1.5;
  }
  .page-header .page-actions {
    display: flex;
    gap: var(--dp-gap-2);
    align-items: center;
    flex-wrap: wrap;
  }

  /* ───────────────────────────────────────────────────────
     Card primitive
     ─────────────────────────────────────────────────────── */
  .card {
    background: var(--dp-surface);
    border: 1px solid var(--dp-line);
    border-radius: var(--dp-radius-lg);
    box-shadow: var(--dp-shadow-sm);
  }
  .card-head {
    padding: 14px 20px;
    border-bottom: 1px solid var(--dp-line);
    background: var(--dp-surface-soft);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--dp-gap-3);
    border-radius: var(--dp-radius-lg) var(--dp-radius-lg) 0 0;
  }
  .card-head h2, .card-head h3 {
    font-size: var(--dp-fs-base);
    font-weight: 700;
    color: var(--dp-ink-1);
    margin: 0;
  }
  .card-head p {
    font-size: var(--dp-fs-sm);
    color: var(--dp-ink-3);
    margin: 3px 0 0;
  }
  .card-body { padding: 20px; }
  .card-foot {
    padding: 12px 20px;
    border-top: 1px solid var(--dp-line);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: var(--dp-gap-2);
  }

  /* ───────────────────────────────────────────────────────
     Buttons — gradient primary, secondary/accent/danger
     ─────────────────────────────────────────────────────── */
  .btn-primary {
    background: linear-gradient(135deg, var(--dp-brand-dark) 0%, var(--dp-brand) 100%);
    color: white;
    padding: 0.55rem 1.1rem;
    border-radius: var(--dp-radius-sm);
    font-weight: 600;
    font-size: var(--dp-fs-base);
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    border: none;
    cursor: pointer;
    text-decoration: none;
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 20px -6px rgba(2, 132, 199, 0.4);
    color: white;
  }
  .btn-secondary {
    background: white;
    color: var(--dp-ink-1);
    padding: 0.55rem 1.1rem;
    border-radius: var(--dp-radius-sm);
    font-weight: 600;
    font-size: var(--dp-fs-base);
    border: 1px solid var(--dp-line);
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
    text-decoration: none;
  }
  .btn-secondary:hover { border-color: var(--dp-brand); color: var(--dp-brand); }
  .btn-accent {
    background: var(--dp-info);
    color: white;
    padding: 0.55rem 1.1rem;
    border-radius: var(--dp-radius-sm);
    font-weight: 600;
    font-size: var(--dp-fs-base);
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    border: none;
    cursor: pointer;
    text-decoration: none;
  }
  .btn-accent:hover { background: #1D4ED8; transform: translateY(-1px); color: white; }
  .btn-danger {
    background: var(--dp-danger);
    color: white;
    padding: 0.55rem 1.1rem;
    border-radius: var(--dp-radius-sm);
    font-weight: 600;
    font-size: var(--dp-fs-base);
    border: none;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    transition: background 0.15s;
  }
  .btn-danger:hover { background: #b91c1c; color: white; }
  .btn-sm {
    padding: 0.35rem 0.7rem;
    font-size: var(--dp-fs-sm);
    border-radius: var(--dp-radius-sm);
  }
  .btn-icon {
    width: 36px; height: 36px;
    padding: 0;
    display: inline-grid;
    place-items: center;
    background: white;
    color: var(--dp-ink-3);
    border: 1px solid var(--dp-line);
    border-radius: var(--dp-radius-sm);
    cursor: pointer;
    text-decoration: none;
    transition: all 0.15s ease;
  }
  .btn-icon:hover { color: var(--dp-brand); border-color: var(--dp-brand); }

  /* Focus rings */
  .btn-primary:focus-visible,
  .btn-secondary:focus-visible,
  .btn-accent:focus-visible,
  .btn-danger:focus-visible,
  .btn-icon:focus-visible,
  .nav-link:focus-visible {
    outline: 3px solid var(--dp-brand);
    outline-offset: 2px;
  }

  /* ───────────────────────────────────────────────────────
     Inputs
     ─────────────────────────────────────────────────────── */
  .input, .select, .textarea, .form-control, .form-select {
    width: 100%;
    padding: 0.55rem 0.75rem;
    border: 1px solid var(--dp-line);
    border-radius: var(--dp-radius-sm);
    background: white;
    transition: all 0.15s ease;
    font-family: inherit;
    color: var(--dp-ink-1);
    font-size: var(--dp-fs-base);
  }
  .input:focus, .select:focus, .textarea:focus,
  .form-control:focus, .form-select:focus {
    outline: none;
    border-color: var(--dp-brand);
    box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
  }
  .input::placeholder, .textarea::placeholder,
  .form-control::placeholder { color: var(--dp-ink-4); }

  .form-label {
    font-weight: 600;
    color: var(--dp-ink-1);
    margin-bottom: 0.4rem;
    display: block;
    font-size: var(--dp-fs-sm);
  }
  .form-text {
    font-size: var(--dp-fs-xs);
    color: var(--dp-ink-3);
    margin-top: 0.35rem;
  }

  /* ───────────────────────────────────────────────────────
     Badges — status pills
     ─────────────────────────────────────────────────────── */
  .badge {
    padding: 0.25rem 0.625rem;
    border-radius: var(--dp-radius-pill);
    font-size: var(--dp-fs-xs);
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .badge-success  { background: var(--dp-success-soft); color: #166534; }
  .badge-warning  { background: var(--dp-warning-soft); color: #92400E; }
  .badge-danger   { background: var(--dp-danger-soft);  color: #991B1B; }
  .badge-info     { background: var(--dp-info-soft);    color: #1D4ED8; }
  .badge-brand    { background: var(--dp-brand-tint);   color: var(--dp-brand-dark); }
  .badge-muted    { background: var(--dp-surface-soft); color: var(--dp-ink-3); }

  /* Aliases for older markup */
  .badge-status { padding: 0.25rem 0.625rem; border-radius: var(--dp-radius-pill); font-size: var(--dp-fs-xs); font-weight: 600; }
  .badge-status.success { background: var(--dp-success-soft); color: #166534; }
  .badge-status.warning { background: var(--dp-warning-soft); color: #92400E; }
  .badge-status.danger  { background: var(--dp-danger-soft);  color: #991B1B; }
  .badge-status.info    { background: var(--dp-info-soft);    color: #1D4ED8; }
  .badge-status.muted   { background: var(--dp-surface-soft); color: var(--dp-ink-3); }

  /* ───────────────────────────────────────────────────────
     Data tables
     ─────────────────────────────────────────────────────── */
  table.data-table,
  .table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 0;
  }
  table.data-table thead th,
  .table thead th {
    background: var(--dp-surface-soft);
    color: var(--dp-ink-3);
    font-weight: 700;
    font-size: var(--dp-fs-xs);
    padding: 0.75rem 1rem;
    text-align: start;
    border-bottom: 1px solid var(--dp-line);
    text-transform: none;
    letter-spacing: 0.02em;
  }
  table.data-table tbody td,
  .table tbody td {
    padding: 0.85rem 1rem;
    border-bottom: 1px solid #f1f5f9;
    font-size: var(--dp-fs-base);
    vertical-align: middle;
  }
  table.data-table tbody tr:hover,
  .table tbody tr:hover { background: var(--dp-surface-soft); }
  table.data-table tbody tr:last-child td,
  .table tbody tr:last-child td { border-bottom: 0; }

  .table-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* ───────────────────────────────────────────────────────
     Callouts
     ─────────────────────────────────────────────────────── */
  .dp-callout {
    border: 1px solid var(--dp-line);
    background: var(--dp-surface-soft);
    border-radius: var(--dp-radius-md);
    padding: 14px 16px;
    display: flex;
    gap: 11px;
    align-items: flex-start;
    font-size: var(--dp-fs-sm);
    line-height: 1.75;
    color: var(--dp-ink-2);
    margin-bottom: var(--dp-gap-4);
  }
  .dp-callout .dp-callout-title { font-weight: 700; display: block; margin-bottom: 3px; color: var(--dp-ink-1); }
  .dp-callout.tone-warn   { background: var(--dp-warning-soft); border-color: #fcd34d; color: #78350f; }
  .dp-callout.tone-info   { background: var(--dp-info-soft);    border-color: #93c5fd; color: #1e3a8a; }
  .dp-callout.tone-danger { background: var(--dp-danger-soft);  border-color: #fca5a5; color: #7f1d1d; }
  .dp-callout.tone-brand  { background: var(--dp-brand-soft);   border-color: #7dd3fc; color: var(--dp-brand-dark); }
  .dp-callout.tone-success { background: var(--dp-success-soft); border-color: #86efac; color: #166534; }

  /* ───────────────────────────────────────────────────────
     Chips
     ─────────────────────────────────────────────────────── */
  .dp-chip {
    font-size: var(--dp-fs-xs);
    font-weight: 600;
    background: var(--dp-info-soft);
    color: #1e40af;
    border-radius: var(--dp-radius-pill);
    padding: 2px 9px;
    white-space: nowrap;
    display: inline-block;
  }
  .dp-chip.tone-warn   { background: var(--dp-warning-soft); color: #92400e; }
  .dp-chip.tone-danger { background: var(--dp-danger-soft);  color: #991b1b; }
  .dp-chip.tone-brand  { background: var(--dp-brand-tint);   color: var(--dp-brand-dark); }
  .dp-chip.tone-success{ background: var(--dp-success-soft); color: #166534; }
  .dp-chip.tone-muted  { background: var(--dp-surface-soft); color: var(--dp-ink-3); }

  /* ───────────────────────────────────────────────────────
     Flash messages (top-right)
     ─────────────────────────────────────────────────────── */
  .flash-stack {
    position: fixed;
    top: 74px;
    left: 20px;
    z-index: 1050;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .flash-item {
    background: white;
    border-right: 4px solid var(--dp-brand);
    padding: 12px 14px;
    border-radius: var(--dp-radius-sm);
    box-shadow: var(--dp-shadow-md);
    font-size: var(--dp-fs-sm);
    display: flex;
    align-items: start;
    gap: 8px;
    animation: dp-flash-in 0.3s ease-out;
  }
  .flash-item.success { border-color: var(--dp-success); }
  .flash-item.warning { border-color: var(--dp-warning); }
  .flash-item.danger  { border-color: var(--dp-danger); }
  .flash-item.info    { border-color: var(--dp-info); }
  @keyframes dp-flash-in {
    from { opacity: 0; transform: translateX(-10px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* ───────────────────────────────────────────────────────
     Sidebar sections (collapsible)
     ─────────────────────────────────────────────────────── */
  .sidebar-section { border-bottom: 1px solid rgba(148,163,184,0.08); padding-bottom: 2px; }
  .sidebar-section:last-of-type { border-bottom: none; }
  .section-body { overflow: hidden; transition: max-height 0.3s ease, opacity 0.2s ease; max-height: 600px; opacity: 1; }
  .section-collapsed { max-height: 0 !important; opacity: 0; }
  .section-chevron { display: inline-block; transition: transform 0.2s ease; }
  .section-collapsed-chevron { transform: rotate(-90deg); }

  .nav-link {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 20px 8px 36px;
    font-size: var(--dp-fs-sm);
    color: var(--dp-ink-2);
    transition: all 0.15s ease;
    text-decoration: none;
    position: relative;
  }
  .nav-link:hover {
    background: var(--dp-brand-soft);
    color: var(--dp-brand-dark);
  }
  .nav-link.active {
    background: var(--dp-brand-tint);
    color: var(--dp-brand);
    font-weight: 700;
    border-right: 3px solid var(--dp-brand);
  }

  .section-toggle {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    font-size: var(--dp-fs-sm);
    font-weight: 700;
    color: var(--dp-ink-1);
    background: none;
    border: none;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .section-toggle:hover { background: rgba(14, 165, 233, 0.05); }

  /* ───────────────────────────────────────────────────────
     Sidebar shell
     ─────────────────────────────────────────────────────── */
  .app-sidebar {
    background: var(--dp-surface-soft);
    color: var(--dp-ink-2);
    width: 260px;
    height: 100vh;
    position: fixed;
    top: 0;
    right: 0;
    border-left: 1px solid var(--dp-line);
    display: flex;
    flex-direction: column;
    z-index: 40;
    transition: transform 250ms ease;
  }
  body.sidebar-hidden .app-sidebar { transform: translateX(100%); }
  body.sidebar-hidden .app-main { margin-right: 0 !important; }

  .app-sidebar-brand {
    padding: 18px 20px;
    border-bottom: 1px solid var(--dp-line);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .app-sidebar-brand .brand-logo {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, var(--dp-brand-dark), var(--dp-brand));
    border-radius: 12px;
    display: grid; place-items: center;
    color: white;
    font-weight: 800;
    font-size: 1.1rem;
    box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
  }
  .app-sidebar-brand .brand-name {
    font-weight: 800;
    color: var(--dp-ink-1);
    font-size: 1.05rem;
    line-height: 1.2;
  }
  .app-sidebar-brand .brand-sub {
    font-size: 0.7rem;
    color: var(--dp-ink-3);

<script>
  const SESSION_ID = 1;
  const TAX_ENABLED = true;
  const TAX_RATE = parseFloat("14.000") || 0;
  const cart = new Map();  // variant_id → {id, name, sku, price, qty, stock}
  const csrfToken = document.querySelector('meta[name="csrf-token"]')?.content || "";

  const scanInput = document.getElementById('scanInput');
  const productGrid = document.getElementById('productGrid');
  const cartItems = document.getElementById('cartItems');

  let searchDebounce;
  scanInput.addEventListener('input', () => {
    clearTimeout(searchDebounce);
    const q = scanInput.value.trim();
    if (!q) { renderGrid([]); return; }

    // إذا كان النص يشبه EAN-13 (13 رقم)، جرّب lookup مباشر
    if (/^\d{13}$/.test(q)) {
      fetch(`/products/api/by-barcode/${q}`)
        .then(r => r.json())
        .then(v => {
          if (v.found) {
            addToCart(v);
            scanInput.value = '';
            renderGrid([]);
          }
        });
      return;
    }

    searchDebounce = setTimeout(async () => {
      const r = await fetch(`/products/api/search?q=${encodeURIComponent(q)}`);
      const data = await r.json();
      renderGrid(data);
    }, 200);
  });

  scanInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      // إن كان هناك نتيجة واحدة، أضفها
      const cards = productGrid.querySelectorAll('.pos-product-card:not(.out-of-stock)');
      if (cards.length === 1) {
        cards[0].click();
        scanInput.value = '';
        renderGrid([]);
      }
    }
  });

  function renderGrid(items) {
    if (!items.length) {
      productGrid.innerHTML = '';
      return;
    }
    productGrid.innerHTML = items.map(v => {
      const outOfStock = parseFloat(v.stock) <= 0;
      return `
        <div class="pos-product-card ${outOfStock ? 'out-of-stock' : ''}"
             data-payload='${JSON.stringify(v).replace(/'/g, "&#39;")}'>
          <div class="name">${v.name}</div>
          <div class="sku">${v.sku}</div>
          <div class="price">${v.price} ج.م</div>
          <div class="stock">متاح: ${v.stock}</div>
        </div>
      `;
    }).join('');
    productGrid.querySelectorAll('.pos-product-card').forEach(card => {
      if (card.classList.contains('out-of-stock')) return;
      card.addEventListener('click', () => {
        const v = JSON.parse(card.dataset.payload);
        addToCart(v);
      });
    });
  }

  function addToCart(v) {
    const existing = cart.get(v.id);
    if (existing) {
      if (existing.qty + 1 > parseFloat(v.stock)) {
        alert('الرصيد المتاح لا يسمح بزيادة الكمية.');
        return;
      }
      existing.qty += 1;
    } else {
      cart.set(v.id, {
        id: v.id, name: v.name, sku: v.sku,
        price: parseFloat(v.price), qty: 1,
        stock: parseFloat(v.stock),
      });
    }
    renderCart();
    scanInput.focus();
  }

  function updateQty(id, newQty) {
    const item = cart.get(id);
    if (!item) return;
    if (newQty <= 0) { cart.delete(id); renderCart(); return; }
    if (newQty > item.stock) { alert('تجاوز الرصيد المتاح.'); return; }
    item.qty = newQty;
    renderCart();
  }

  function removeFromCart(id) { cart.delete(id); renderCart(); }

  function clearCart() {
    if (!cart.size) return;
    if (confirm('إفراغ السلة؟')) { cart.clear(); renderCart(); }
  }

  function renderCart() {
    if (!cart.size) {
      cartItems.innerHTML = `
        <div class="cart-empty">
          <i class="bi bi-basket" style="font-size:2rem"></i>
          <p>لا توجد بنود</p>
        </div>`;
      recalc();
      return;
    }
    let html = '';
    cart.forEach(item => {
      const lineTotal = (item.price * item.qty).toFixed(3);
      html += `
        <div class="cart-line">
          <div>
            <div class="name">${item.name}</div>
            <div class="meta">${item.sku} · ${item.price.toFixed(3)}</div>
            <div class="qty-ctrl mt-1">
              <button onclick="updateQty(${item.id}, ${item.qty - 1})">−</button>
              <input type="number" value="${item.qty}" step="0.001" min="0"
                     onchange="updateQty(${item.id}, parseFloat(this.value)||0)">
              <button onclick="updateQty(${item.id}, ${item.qty + 1})">+</button>
              <button onclick="removeFromCart(${item.id})" style="color:#dc2626; border-color:#fecaca">
                <i class="bi bi-x"></i>
              </button>
            </div>
          </div>
          <div class="line-total">${lineTotal}</div>
        </div>
      `;
    });
    cartItems.innerHTML = html;
    recalc();
  }

  function recalc() {
    let subtotal = 0;
    cart.forEach(item => subtotal += item.price * item.qty);
    const discount = parseFloat(document.getElementById('discountInput').value) || 0;
    const net = Math.max(0, subtotal - discount);
    const tax = TAX_ENABLED ? net * (TAX_RATE / 100) : 0;
    const total = net + tax;
    document.getElementById('sumSubtotal').textContent = subtotal.toFixed(3);
    if (TAX_ENABLED) document.getElementById('sumTax').textContent = tax.toFixed(3);
    document.getElementById('sumTotal').textContent = total.toFixed(3);
  }

  document.getElementById('discountInput').addEventListener('input', recalc);

  async function pay(method) {
    if (!cart.size) { alert('السلة فارغة.'); return; }
    const customerId = document.getElementById('customerId').value;
    if (!customerId) { alert('اختر عميلًا (أو استخدم العميل النقدي الافتراضي).'); return; }

    const lines = [];
    cart.forEach(item => lines.push({
      variant_id: item.id, qty: item.qty, unit_price: item.price
    }));

    const payload = {
      customer_id: parseInt(customerId),
      payment_method: method,
      discount_amount: document.getElementById('discountInput').value || 0,
      lines: lines,
    };

    const r = await fetch(`/pos/session/${SESSION_ID}/sale`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrfToken},
      body: JSON.stringify(payload),
    });
    const data = await r.json();
    if (!data.ok) {
      alert('فشل: ' + (data.error || 'خطأ غير معروف'));
      return;
    }

    // فتح الإيصال في نافذة جديدة للطباعة، وتفريغ السلة
    window.open(data.receipt_url, '_blank', 'width=380,height=700');
    cart.clear();
    document.getElementById('discountInput').value = '0';
    renderCart();
    scanInput.value = '';
    scanInput.focus();
  }

  // بحث العميل
  const customerSearch = document.getElementById('customerSearch');
  const customerResults = document.getElementById('customerResults');
  let custDebounce;
  customerSearch.addEventListener('input', () => {
    clearTimeout(custDebounce);
    const q = customerSearch.value.trim();
    if (!q) { customerResults.innerHTML = ''; return; }
    custDebounce = setTimeout(async () => {
      const r = await fetch(`/parties/api/search?type=customer&q=${encodeURIComponent(q)}`);
      const data = await r.json();
      customerResults.innerHTML = data.map(p => `
        <button type="button" class="list-group-item list-group-item-action text-start"
                data-id="${p.id}" data-name="${p.name_ar}">
          <strong>${p.name_ar}</strong>
          <span class="text-muted small ms-2" dir="ltr">${p.code}</span>
        </button>
      `).join('');
      customerResults.querySelectorAll('button').forEach(b => {
        b.addEventListener('click', () => {
          document.getElementById('customerId').value = b.dataset.id;
          customerSearch.value = b.dataset.name;
          customerResults.innerHTML = '';
        });
      });
    }, 200);
  });
  document.addEventListener('click', (e) => {
    if (!customerSearch.contains(e.target) && !customerResults.contains(e.target)) {
      customerResults.innerHTML = '';
    }
  });
</script>


  
  


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Sidebar toggle (both desktop hide and mobile drawer)
    function toggleSidebar(force) {
      const isMobile = window.matchMedia('(max-width: 900px)').matches;
      if (isMobile) {
        const isOpen = document.body.classList.contains('sidebar-open-mobile');
        const shouldOpen = (typeof force === 'boolean') ? force : !isOpen;
        document.body.classList.toggle('sidebar-open-mobile', shouldOpen);
        const bd = document.getElementById('sidebar-backdrop');
        if (bd) bd.classList.toggle('hidden', !shouldOpen);
      } else {
        document.body.classList.toggle('sidebar-hidden');
      }
    }
    // Collapsible sidebar sections
    function toggleSection(btn) {
      const body = btn.nextElementSibling;
      const chev = btn.querySelector('.section-chevron');
      if (!body) return;
      const isCollapsed = body.classList.toggle('section-collapsed');
      if (chev) chev.classList.toggle('section-collapsed-chevron', isCollapsed);
    }
    // Auto-dismiss flash messages
    setTimeout(() => {
      document.querySelectorAll('.flash-item').forEach(el => {
        el.style.transition = 'opacity 0.35s ease';
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 400);
      });
    }, 4500);
  </script>
