{% extends "storefront/_base.html" %}
{% block title %}إنشاء حساب{% endblock %}

{% block content %}
<div style="max-width:440px; margin:40px auto; background:white;
            border:1px solid var(--dp-line); border-radius:16px; padding:40px 30px;">
  <div style="text-align:center; margin-bottom:24px;">
    <div style="width:68px; height:68px; margin:0 auto 12px; border-radius:18px;
                background:linear-gradient(135deg,var(--dp-brand-dark),var(--dp-brand));
                color:white; display:grid; place-items:center; font-size:1.6rem;
                box-shadow:0 12px 30px rgba(2,132,199,.3);">
      <i class="bi bi-person-plus"></i>
    </div>
    <h1 style="font-size:1.5rem; font-weight:800; margin:0 0 6px;">إنشاء حساب</h1>
    <p style="color:var(--dp-ink-3); font-size:0.9rem; margin:0;">
      حسابك الشخصي في {{ sf_settings.store_name }}
    </p>
  </div>

  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label">الاسم الكامل *</label>
      <input type="text" name="name" class="form-control form-control-lg" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label">رقم الهاتف *</label>
      <input type="tel" name="phone" class="form-control form-control-lg" required
             placeholder="01xxxxxxxxx" dir="ltr">
      <div class="form-text">
        لو عندك طلبات سابقة بنفس الرقم، ستُربط تلقائيًا بحسابك.
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label">البريد الإلكتروني (اختياري)</label>
      <input type="email" name="email" class="form-control" dir="ltr">
    </div>
    <div class="mb-4">
      <label class="form-label">كلمة المرور *</label>
      <input type="password" name="password" class="form-control form-control-lg" required minlength="6">
      <div class="form-text">6 أحرف على الأقل.</div>
    </div>
    <button type="submit" class="sf-btn-primary" style="width:100%; justify-content:center; padding:12px;">
      <i class="bi bi-person-plus"></i> أنشئ الحساب
    </button>
  </form>

  <hr style="margin:24px 0; border-color:var(--dp-line);">
  <div style="text-align:center; color:var(--dp-ink-3); font-size:0.9rem;">
    عندك حساب مسبقًا؟
    <a href="{{ url_for('storefront.account_login') }}" style="color:var(--dp-brand); font-weight:600;">
      سجّل الدخول
    </a>
  </div>
</div>
{% endblock %}
