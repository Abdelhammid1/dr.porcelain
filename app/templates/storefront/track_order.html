{% extends "storefront/_base.html" %}
{% block title %}تتبع طلبك{% endblock %}

{% block content %}
<div style="max-width:520px; margin:40px auto;">
  <div style="background:white; border:1px solid var(--dp-line); border-radius:14px; padding:30px;">
    <h1 style="font-size:1.6rem; font-weight:800; margin-bottom:16px;">
      <i class="bi bi-truck"></i> تتبع طلبك
    </h1>
    <p style="color:var(--dp-ink-3); margin-bottom:24px;">
      أدخل رقم الطلب ورقم الهاتف الذي استُخدم أثناء الطلب.
    </p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">رقم الطلب</label>
        <input type="text" name="order_number" class="form-control" required dir="ltr" placeholder="ORD-2026-000001">
      </div>
      <div class="mb-3">
        <label class="form-label">رقم الهاتف</label>
        <input type="tel" name="phone" class="form-control" required dir="ltr">
      </div>
      <button type="submit" class="sf-btn-primary" style="width:100%; justify-content:center;">
        <i class="bi bi-search"></i> تتبع الطلب
      </button>
    </form>
  </div>
</div>
{% endblock %}
