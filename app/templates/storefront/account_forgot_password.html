{% extends "storefront/_base.html" %}
{% block title %}نسيت كلمة المرور{% endblock %}

{% block content %}
<div style="max-width:480px; margin:40px auto;">
  <div style="background:white; border:1px solid var(--dp-line); border-radius:14px; padding:30px;">
    <h1 style="font-size:1.4rem; font-weight:800; margin-bottom:16px;">
      <i class="bi bi-key"></i> نسيت كلمة المرور؟
    </h1>
    <p class="text-muted small mb-4">
      أدخل رقم الهاتف أو الإيميل المسجّل. لو الحساب موجود، هيوصلك لينك لإعادة التعيين.
    </p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">رقم الهاتف أو الإيميل</label>
        <input type="text" name="phone_or_email" class="form-control" required dir="ltr">
      </div>
      <button type="submit" class="sf-btn-primary" style="width:100%; justify-content:center;">
        إرسال لينك الاسترجاع
      </button>
      <div class="text-center mt-3">
        <a href="{{ url_for('storefront.account_login') }}" class="text-muted small">رجوع لتسجيل الدخول</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
