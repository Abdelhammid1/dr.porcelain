{% extends "base.html" %}
{% block title %}نسيت كلمة المرور{% endblock %}

{% block body %}
<div class="login-page">
  <div class="login-card">
  <h1 style="font-size:1.4rem; font-weight:800; margin-bottom:16px;">
    <i class="bi bi-key"></i> نسيت كلمة المرور؟
  </h1>
  <p class="text-muted small mb-4">
    أدخل بريدك الإلكتروني المسجّل وسيصلك لينك لإعادة تعيين كلمة المرور خلال دقائق.
  </p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label">البريد الإلكتروني</label>
      <input type="email" name="email" class="form-control" required dir="ltr">
    </div>
    <button type="submit" class="btn btn-primary w-100">
      <i class="bi bi-send"></i> إرسال لينك الاسترجاع
    </button>
    <div class="text-center mt-3">
      <a href="{{ url_for('auth.login') }}" class="text-muted small">رجوع لتسجيل الدخول</a>
    </div>
  </form>
  </div>
</div>
{% endblock %}
