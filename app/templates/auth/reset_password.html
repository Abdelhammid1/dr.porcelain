{% extends "base.html" %}
{% block title %}إعادة تعيين كلمة المرور{% endblock %}

{% block body %}
<div class="login-page">
  <div class="login-card">
  <h1 style="font-size:1.4rem; font-weight:800; margin-bottom:16px;">
    <i class="bi bi-shield-lock"></i> إعادة تعيين كلمة المرور
  </h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label">كلمة المرور الجديدة (6+ أحرف)</label>
      <input type="password" name="new_password" class="form-control" required minlength="6">
    </div>
    <div class="mb-3">
      <label class="form-label">تأكيد كلمة المرور</label>
      <input type="password" name="confirm" class="form-control" required minlength="6">
    </div>
    <button type="submit" class="btn btn-primary w-100">
      <i class="bi bi-check-lg"></i> تحديث كلمة المرور
    </button>
  </form>
  </div>
</div>
{% endblock %}
