{% extends "base.html" %}
{% block title %}إعادة تعيين كلمة المرور{% endblock %}

{% block body %}
<div class="min-h-screen bg-background flex items-center justify-center p-space-lg">
  <div class="bg-surface-container-lowest w-full max-w-md rounded-xl p-space-2xl shadow-[0_25px_50px_-12px_rgba(11,28,48,0.15)]">
    <div class="text-center mb-space-lg">
      <div class="w-14 h-14 mx-auto rounded-full bg-secondary-fixed text-secondary flex items-center justify-center mb-space-xs">
        <span class="material-symbols-outlined text-[28px]">lock_reset</span>
      </div>
      <h1 class="font-headline-lg text-headline-lg text-on-surface font-bold">إعادة تعيين كلمة المرور</h1>
    </div>

    {% include "partials/flash.html" %}

    <form method="post" novalidate class="space-y-space-md">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div>
        <label class="font-label-md text-label-md text-on-surface-variant font-medium mb-1 block">كلمة المرور الجديدة (6+ أحرف)</label>
        <input type="password" name="new_password" required minlength="6"
               class="h-11 w-full px-space-sm rounded-lg bg-surface-container-low text-on-surface font-body-md text-body-md outline outline-1 outline-outline-variant/60 focus:outline-secondary">
      </div>
      <div>
        <label class="font-label-md text-label-md text-on-surface-variant font-medium mb-1 block">تأكيد كلمة المرور</label>
        <input type="password" name="confirm" required minlength="6"
               class="h-11 w-full px-space-sm rounded-lg bg-surface-container-low text-on-surface font-body-md text-body-md outline outline-1 outline-outline-variant/60 focus:outline-secondary">
      </div>
      <button type="submit"
              class="h-11 w-full rounded-lg bg-secondary text-on-secondary hover:bg-secondary/90 font-label-lg text-label-lg font-semibold flex items-center justify-center gap-space-xs shadow-sm transition-colors">
        <span class="material-symbols-outlined text-[20px]">check_circle</span>
        <span>تحديث كلمة المرور</span>
      </button>
    </form>
  </div>
</div>
{% endblock %}
