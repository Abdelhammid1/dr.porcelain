<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}{% endblock %} — دكتور بورسلين</title>

  <!-- Tailwind (utility layer) + Bootstrap Icons + Cairo font -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Cairo', 'Inter', 'system-ui', 'sans-serif'] },
          colors: {
            brand:   { 500:'#0ea5e9', 600:'#0284c7', 700:'#0369a1' },
            navy:    { 800:'#0f172a', 700:'#334155', 500:'#64748b', 300:'#cbd5e1' },
          },
        },
      },
    };
  </script>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

  {% include "_design_tokens.html" %}

  <style>
    body {
      font-family: var(--dp-font-body);
      background: var(--dp-app-bg);
      color: var(--dp-ink-1);
      margin: 0;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--dp-brand); text-decoration: none; }
    a:hover { color: var(--dp-brand-dark); }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>

  {% block head %}{% endblock %}
</head>
<body class="antialiased">
  {% block body %}{% endblock %}

  {% include "partials/flash.html" %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Sidebar toggle (both desktop hide and mobile drawer)
    function toggleSidebar(force) {
      const isMobile = window.matchMedia('(max-width: 900px)').matches;
      if (isMobile) {
        const isOpen = document.body.classList.contains('sidebar-open-mobile');
        const shouldOpen = (typeof force === 'boolean') ? force : !isOpen;
        document.body.classList.toggle('sidebar-open-mobile', shouldOpen);
        const bd = document.getElementById('sidebar-backdrop');
        if (bd) bd.classList.toggle('hidden', !shouldOpen);
      } else {
        document.body.classList.toggle('sidebar-hidden');
      }
    }
    // Collapsible sidebar sections
    function toggleSection(btn) {
      const body = btn.nextElementSibling;
      const chev = btn.querySelector('.section-chevron');
      if (!body) return;
      const isCollapsed = body.classList.toggle('section-collapsed');
      if (chev) chev.classList.toggle('section-collapsed-chevron', isCollapsed);
    }
    // Auto-dismiss flash messages
    setTimeout(() => {
      document.querySelectorAll('.flash-item').forEach(el => {
        el.style.transition = 'opacity 0.35s ease';
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 400);
      });
    }, 4500);
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
